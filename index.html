<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Riot-Gamer</title>
</head>
<body>
    <main class="login-page">
        <section class="login-container">
            <div class="riot-logo">
                <img src="imagens/riot-logo.png" alt="Logo da Riot Games">
            </div>
            <h1>faça seu login</h1>
            <form action="#" method="POST">
                <input type="text" name="nome" placeholder="Nome de usuário" required>
                <input type="password" name="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p>Ainda não tem uma conta? <a href="register.html">Cadastre-se aqui</a></p>

            <div class="social-login">
                <p>ou entre com:</p>
                <div class="social-icons">
                    <a href="#" class="social-icon">
                        <img src="imagens/facebook-icone.png" alt="Facebook" width="30" height="30">
                    </a>
                    <a href="#" class="social-icon">
                        <img src="imagens/google-icon.png" alt="Google" width="30" height="30">
                    </a>
                    <a href="#" class="social-icon">
                        <img src="imagens/xbox-icon.png" alt="Xbox" width="30" height="30">
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
